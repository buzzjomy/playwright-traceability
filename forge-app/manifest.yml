modules:
  jira:projectPage:
    - key: playwright-traceability-project-page
      resource: main
      render: native
      title: Traceability
      # Frontend calls go through this endpoint (invokeRemote), which is what
      # makes Forge attach the app system token the backend reads Jira with.
      resolver:
        endpoint: traceability-endpoint
  # Keep Suspect links current with no webhook or polling script to set up
  # (issue #41). Both call the backend directly, each with a fresh app system
  # token, so the backend stores no tokens.
  trigger:
    - key: issue-updated-trigger
      endpoint: issue-updated-endpoint
      events:
        - avi:jira:updated:issue
  scheduledTrigger:
    # A safety net for missed events. Must stay under 2 hours: that is how long
    # a delivered system token is guaranteed to be valid.
    - key: scheduled-poll-trigger
      endpoint: scheduled-poll-endpoint
      interval: hour
  endpoint:
    - key: traceability-endpoint
      remote: traceability-backend
      auth:
        appSystemToken:
          enabled: true
    - key: issue-updated-endpoint
      remote: traceability-backend
      route:
        path: /api/forge/events/issue-updated
      auth:
        appSystemToken:
          enabled: true
    - key: scheduled-poll-endpoint
      remote: traceability-backend
      route:
        path: /api/forge/scheduled/poll
      auth:
        appSystemToken:
          enabled: true
resources:
  - key: main
    path: src/frontend/index.jsx
# The FastAPI backend (backend/, deployed to Fly.io - issue #27) this app
# calls as a Forge Remote, from the frontend via invokeRemote().
remotes:
  - key: traceability-backend
    baseUrl: https://playwright-traceability.fly.dev
    operations:
      - fetch
permissions:
  # The app system token carries only these: reading Jira issues as the app's
  # bot user (issue #41). The backend never writes to Jira.
  scopes:
    - read:app-system-token
    - read:jira-work
  external:
    fetch:
      backend:
        - remote: traceability-backend
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/79162d82-2e1f-46ed-bd6b-252c13f4c937
