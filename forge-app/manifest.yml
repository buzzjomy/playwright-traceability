modules:
  jira:projectPage:
    - key: playwright-traceability-project-page
      resource: main
      render: native
      title: Traceability
      # Frontend calls go through this endpoint (invokeRemote), which is what
      # makes Forge attach the app system token the backend reads Jira with.
      resolver:
        endpoint: traceability-endpoint
  endpoint:
    - key: traceability-endpoint
      remote: traceability-backend
      auth:
        appSystemToken:
          enabled: true
resources:
  - key: main
    path: src/frontend/index.jsx
# The FastAPI backend (backend/, deployed to Fly.io - issue #27) this app
# calls as a Forge Remote, from the frontend via invokeRemote().
remotes:
  - key: traceability-backend
    baseUrl: https://playwright-traceability.fly.dev
    operations:
      - fetch
permissions:
  # The app system token carries only these: reading Jira issues as the app's
  # bot user (issue #41). The backend never writes to Jira.
  scopes:
    - read:app-system-token
    - read:jira-work
  external:
    fetch:
      backend:
        - remote: traceability-backend
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/79162d82-2e1f-46ed-bd6b-252c13f4c937
