name: CI

# Runs on every push/PR - unlike real-jira-integration.yml (daily,
# schedule/workflow_dispatch only), this needs no secrets, so it's safe
# to run against untrusted fork PRs too.
on:
  push:
    branches: [master]
  pull_request: {}

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    # A real Postgres for tests/test_migrations_postgres.py - production runs
    # on Postgres, and migrations behave differently from SQLite there.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MIGRATION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/migrations
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install static_parser dependencies
        run: npm install
        working-directory: static_parser

      - name: Run backend/parser test suite
        run: pytest

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Typecheck and build
        run: npm run build
        working-directory: frontend

  forge-app-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install forge-app dependencies
        run: npm ci
        working-directory: forge-app

      # ESLint only: `forge lint` needs a real Atlassian login (secrets,
      # unavailable to fork PRs), and `forge deploy` already runs it.
      - name: Lint
        run: npm run lint
        working-directory: forge-app

      - name: Unit tests
        run: npm test
        working-directory: forge-app
