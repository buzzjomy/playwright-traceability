name: Real Jira integration tests

# Regression suite against a real, live Jira Cloud site (not mocks) -
# see tests/integration/README.md for why this exists. Runs daily so a
# Jira API change (like the one that caused issue #11's original bug)
# gets noticed automatically, plus on-demand via workflow_dispatch.
on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch: {}

jobs:
  real-jira-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run real-Jira integration tests
        env:
          JIRA_SITE_URL: ${{ vars.JIRA_SITE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_TEST_PROJECT_KEY: ${{ vars.JIRA_TEST_PROJECT_KEY }}
          JIRA_TEST_ISSUE_KEY: ${{ vars.JIRA_TEST_ISSUE_KEY }}
        run: python -m pytest tests/integration/ -v
